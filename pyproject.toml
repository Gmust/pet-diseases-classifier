[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-care-ai-microservice"
version = "1.0.0"
description = "Pet condition classification, conversational triage, and wellness scoring service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "google-genai==1.35.0",
    "mangum==0.19.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv==1.1.1",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1,<27",
    "detect-secrets>=1.5,<2",
    "httpx>=0.27,<1",
    "isort>=6,<7",
    "mypy>=1.15,<2",
    "pandas==2.2.2",
    "pre-commit>=4,<5",
    "pyarrow==16.1.0",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pyyaml>=6,<7",
    "ruff>=0.11,<1",
    "scikit-learn==1.5.2",
    "types-pyyaml>=6,<7",
]
torch-runtime = [
    "numpy==1.26.4",
    "torch==2.4.1",
    "transformers==4.44.2",
]
onnx-runtime = [
    "numpy==1.26.4",
    "onnxruntime==1.19.2",
    "tokenizers==0.19.1",
]
train = [
    "accelerate==0.34.2",
    "datasets==2.21.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pyarrow==16.1.0",
    "scikit-learn==1.5.2",
    "torch==2.4.1",
    "transformers==4.44.2",
]
export = [
    "numpy==1.26.4",
    "onnx>=1.17,<2",
    "onnxruntime==1.19.2",
    "optimum>=2,<3",
    "optimum-onnx",
    "torch==2.4.1",
    "transformers==4.44.2",
]

[tool.uv]
required-version = ">=0.11.17,<0.12"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["app*", "ml_pipeline*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "ml_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".aws-sam", "graphify-out", "models"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
ignore = [
    "B008", # FastAPI dependencies are intentionally declared in parameter defaults.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["^\\.aws-sam/", "^graphify-out/"]

[[tool.mypy.overrides]]
module = [
    "datasets.*",
    "google.*",
    "mangum.*",
    "onnxruntime.*",
    "optimum.*",
    "pandas.*",
    "sklearn.*",
    "tokenizers.*",
    "torch.*",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    "ignore::pydantic.PydanticDeprecatedSince212:google.genai.types",
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]
# Only modules that cannot execute in the offline test suite are omitted:
# onnx_predictor needs onnxruntime plus an exported model dir, and
# lambda_handler needs a real Lambda invocation event. Everything else in
# `app` is gated, so a new module is covered by default rather than having to
# be added to an allowlist.
omit = [
    "app/inference/onnx_predictor.py",
    "app/lambda_handler.py",
    "ml_pipeline/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

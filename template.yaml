AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Pet Care AI Microservice — AWS Lambda + API Gateway deployment.
  Free tier: 1M requests/month + 400K GB-seconds/month (permanent).

# ── Overridable parameters ──────────────────────────────────────────────────
Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Gemini API key (from aistudio.google.com/apikey)

  GeminiModel:
    Type: String
    Default: gemini-2.5-flash-lite
    Description: "Gemini model name. Free option: gemini-2.5-flash-lite (20 req/day)"

  ApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional X-API-Key for /predict auth (leave empty to disable)

  LowConfidenceThreshold:
    Type: String
    Default: "0.65"
    Description: Confidence below this value adds a low-confidence warning to the explanation

  ApiRateLimit:
    Type: Number
    Default: 20
    Description: "Steady-state request rate (req/s) allowed across all endpoints."

  ApiBurstLimit:
    Type: Number
    Default: 40
    Description: "Maximum burst of concurrent requests before throttling (429)."

  FunctionMemory:
    Type: Number
    Default: 1769
    Description: "Lambda memory (MB). 1769 = a full vCPU, which roughly halves cold-start init time
      vs 1024 (~0.5 vCPU) and is often cheaper per request since duration drops faster than memory rises."

# ── Shared defaults for all Lambda functions ───────────────────────────────
Globals:
  Function:
    # 60 s so a cold start (image pull + model load) plus the Gemini call can't
    # hit the timeout. Warm requests are ~1-3 s; the keep-warm ping keeps it warm.
    Timeout: 60
    # 1 GB — the quantized ONNX model runs comfortably here. (The old torch image
    # needed ~3 GB; ONNX Runtime is what lets us drop it, cutting GB-seconds ~3x.)
    MemorySize: !Ref FunctionMemory
    Environment:
      Variables:
        GEMINI_API_KEY: !Ref GeminiApiKey
        GEMINI_MODEL: !Ref GeminiModel
        API_KEY: !Ref ApiKey
        MODEL_BACKEND: onnx
        MODEL_PATH: models/transformer_model_onnx
        LOW_CONFIDENCE_THRESHOLD: !Ref LowConfidenceThreshold
        ROOT_PATH: /Prod
  Api:
    # Gateway-level throttling protects the Lambda (and your Gemini quota) from
    # bursts/abuse. Requests over the limit get a 429 before reaching the function.
    MethodSettings:
      - ResourcePath: "/*"
        HttpMethod: "*"
        ThrottlingRateLimit: !Ref ApiRateLimit
        ThrottlingBurstLimit: !Ref ApiBurstLimit

# ── Resources ──────────────────────────────────────────────────────────────
Resources:

  PetCareAiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      # Routes: catch-all proxy + explicit root
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        # Keep-warm: invoke every 5 minutes so the container stays hot.
        # The lambda_handler.py swallows EventBridge events (non-HTTP payloads)
        # so this never reaches Mangum/FastAPI.
        KeepWarm:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Prevent cold starts by keeping the Lambda container alive
            Enabled: true
    Metadata:
      DockerTag: latest
      DockerContext: .
      # ONNX Runtime image (no torch). Build the model dir first with export_onnx.py.
      Dockerfile: Dockerfile.lambda.onnx

# ── Outputs ────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: Public API Gateway URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt PetCareAiFunction.Arn

  FunctionName:
    Description: Lambda Function name (useful for logs)
    Value: !Ref PetCareAiFunction

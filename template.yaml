AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Pet Care AI Microservice — AWS Lambda + API Gateway deployment.
  Free tier: 1M requests/month + 400K GB-seconds/month (permanent).

# ── Overridable parameters ──────────────────────────────────────────────────
Parameters:
  RuntimeSecretId:
    Type: String
    MinLength: 1
    Description: Secrets Manager secret id containing API_KEY, GEMINI_API_KEY, and GEMINI_API_KEYS JSON keys

  GeminiModel:
    Type: String
    Default: gemini-2.5-flash-lite
    Description: "Gemini model name. Free option: gemini-2.5-flash-lite (20 req/day)"

  LowConfidenceThreshold:
    Type: String
    Default: "0.65"
    Description: Confidence below this value adds a low-confidence warning to the explanation

  ApiRateLimit:
    Type: Number
    Default: 20
    Description: "Steady-state request rate (req/s) allowed across all endpoints."

  ApiBurstLimit:
    Type: Number
    Default: 40
    Description: "Maximum burst of concurrent requests before throttling (429)."

  FunctionMemory:
    Type: Number
    Default: 1769
    Description: "Lambda memory (MB). 1769 = a full vCPU, which roughly halves cold-start init time
      vs 1024 (~0.5 vCPU) and is often cheaper per request since duration drops faster than memory rises."

  ReservedConcurrency:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Maximum concurrent executions, bounding model memory and provider traffic

# ── Shared defaults for all Lambda functions ───────────────────────────────
Globals:
  Function:
    # 60 s so a cold start (image pull + model load) plus the Gemini call can't
    # hit the timeout. Warm requests are ~1-3 s.
    Timeout: 60
    # 1 GB — the quantized ONNX model runs comfortably here. (The old torch image
    # needed ~3 GB; ONNX Runtime is what lets us drop it, cutting GB-seconds ~3x.)
    MemorySize: !Ref FunctionMemory
    Tracing: Active
    Environment:
      Variables:
        GEMINI_API_KEY: !Sub "{{resolve:secretsmanager:${RuntimeSecretId}:SecretString:GEMINI_API_KEY}}"
        GEMINI_API_KEYS: !Sub "{{resolve:secretsmanager:${RuntimeSecretId}:SecretString:GEMINI_API_KEYS}}"
        GEMINI_MODEL: !Ref GeminiModel
        API_KEY: !Sub "{{resolve:secretsmanager:${RuntimeSecretId}:SecretString:API_KEY}}"
        ENVIRONMENT: production
        MODEL_BACKEND: onnx
        MODEL_PATH: models/transformer_model_onnx
        LOW_CONFIDENCE_THRESHOLD: !Ref LowConfidenceThreshold
        ROOT_PATH: /Prod
  Api:
    TracingEnabled: true
    # Gateway-level throttling protects the Lambda (and your Gemini quota) from
    # bursts/abuse. Requests over the limit get a 429 before reaching the function.
    MethodSettings:
      - ResourcePath: "/*"
        HttpMethod: "*"
        ThrottlingRateLimit: !Ref ApiRateLimit
        ThrottlingBurstLimit: !Ref ApiBurstLimit

# ── Resources ──────────────────────────────────────────────────────────────
Resources:

  PetCareAiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Sub "${AWS::StackName}-pet-care-ai"
      # Routes: catch-all proxy + explicit root
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
    Metadata:
      DockerTag: immutable-release
      DockerContext: .
      # ONNX Runtime image (no torch). Build the model dir first with export_onnx.py.
      Dockerfile: Dockerfile.lambda.onnx

  PetCareAiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-pet-care-ai"
      RetentionInDays: 30

  PetCareAiFunctionErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Detect Lambda function errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PetCareAiFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  PetCareAiFunctionThrottles:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Detect exhausted reserved concurrency
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref PetCareAiFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

# ── Outputs ────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: Public API Gateway URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt PetCareAiFunction.Arn

  FunctionName:
    Description: Lambda Function name (useful for logs)
    Value: !Ref PetCareAiFunction

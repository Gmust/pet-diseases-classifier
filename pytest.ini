[pytest]
testpaths = tests
addopts = -q
# Put the repo root on sys.path so `import app...` works with a bare `pytest`
# invocation (pytest >= 7). Without this, only `python -m pytest` would work.
pythonpath = .
filterwarnings =
    # Deprecation inside the google-genai SDK (third-party, not our code).
    ignore::pydantic.PydanticDeprecatedSince212:google.genai.types
    # FastAPI re-processes request-body models and re-emits this for our
    # camelCase-aliased optional fields (ChatRequest). The aliases work correctly
    # (verified: both camelCase and snake_case parse) — this is FastAPI/pydantic
    # internal noise, not a defect.
    ignore::pydantic.warnings.UnsupportedFieldAttributeWarning

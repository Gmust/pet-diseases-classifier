default_language_version:
  python: python3.11

exclude: >-
  (?x)^(
    \.aws-sam/|
    graphify-out/|
    models/|
    data/.*\.(csv|parquet|pq)$
  )

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: black
        name: Black format
        entry: python -m black
        language: system
        types: [python]
      - id: isort
        name: isort imports
        entry: python -m isort
        language: system
        types: [python]
      - id: check-yaml
        name: Validate YAML
        entry: python scripts/check_yaml.py
        language: system
        types: [yaml]
      - id: detect-secrets
        name: Detect secrets
        entry: detect-secrets-hook
        language: system
        types: [text]
        exclude: ^(?:\.env\.example|docs/.*|openspec/.*)$
      - id: trailing-whitespace
        name: Reject trailing whitespace
        entry: git diff --check --cached
        language: system
        pass_filenames: false
        always_run: true

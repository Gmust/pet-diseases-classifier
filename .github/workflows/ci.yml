name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.11.17

      - name: Sync locked development environment
        run: uv sync --frozen --extra dev

      - name: Verify OpenAPI contract fingerprint
        run: uv run --frozen python scripts/check_docs_sync.py

      - uses: aws-actions/setup-sam@v2

      - name: Validate AWS SAM template
        run: sam validate --lint --template-file template.yaml

      - name: Run fast tests with coverage gate
        run: >-
          uv run --frozen pytest -q
          tests/test_api.py tests/test_units.py
          --cov=app.main
          --cov=app.schemas
          --cov=app.config
          --cov=app.app_services
          --cov=app.services.chat_context
          --cov=app.services.triage_safety
          --cov=app.services.advice_safety
          --cov=app.services.generation_policy
          --cov=app.ml.condition_metadata
          --cov=app.ml.protocols
          --cov=app.ml.model_validation
          --cov=app.use_cases.predict
          --cov=app.use_cases.chat
          --cov=app.use_cases.wellness
          --cov=app.use_cases.errors
          --cov-report=term-missing
          --cov-fail-under=85

      - name: Run complete lightweight test suite
        run: uv run --frozen pytest -q

  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.11.17

      - name: Sync locked development environment
        run: uv sync --frozen --extra dev

      - name: Verify required data-test dependencies
        run: uv run --frozen python -c "import pandas, pyarrow"

      - name: Run required data tests without optional skips
        run: >-
          uv run --frozen pytest -q
          tests/test_prepare_dataset.py
          tests/test_dataset_schema.py
          tests/test_dataset_sources.py
          tests/test_synthetic_quality.py
          tests/test_split_manifest.py
          tests/test_eval_coverage.py
          -rs --strict-markers
